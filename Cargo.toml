[package]
name = "velo"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "Seek"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15"
rayon = "1.10"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
tray-icon = "0.21"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_IO", "Win32_Security", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

